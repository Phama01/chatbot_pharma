<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Lanceur chatbot — Comptoir de pharmacie</title>
<style>
  :root{
    --vert-fonce: #1b4d3e;
    --vert: #256b52;
    --vert-clair: #3f9c78;
    --bleu-fonce: #2d5fa8;
    --bleu-clair: #dfeeff;
    --creme: #f6f3ec;
    --creme-fonce: #eae4d6;
    --bois: #a9754f;
    --bois-fonce: #8a5c3b;
    --encre: #16241f;
    --blanc: #ffffff;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:34px;
    background: radial-gradient(circle at 30% 20%, #eef2ee 0%, var(--creme) 55%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 40px;
  }

  .scene-wrap{
    position:relative;
    width: 360px;
    height: 250px;
    cursor:pointer;
    border-radius: 22px;
    overflow:hidden;
    box-shadow: 0 18px 40px rgba(27,77,62,.18);
  }

  .fond{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }

  .client{
    position:absolute;
    right: 34px;
    bottom: 78px;
    width: 46px;
    height: 78px;
    opacity: 0;
    transform: translateX(40px);
    transition: opacity .35s ease, transform .4s cubic-bezier(.22,1,.36,1);
    z-index: 4;
  }
  .scene-wrap:hover .client{
    opacity: 1;
    transform: translateX(0);
  }

  .pharmacien-scene{
    position:absolute;
    left: 34px;
    bottom: 66px;
    width: 78px;
    height: 88px;
    transform-origin: 50% 100%;
    transition: transform .35s ease;
    animation: idle-float 3.2s ease-in-out infinite;
    z-index: 3;
  }
  .scene-wrap:hover .pharmacien-scene{
    transform: rotate(9deg);
    animation: none;
  }
  .scene-wrap:hover .pharmacien-scene .oeil{
    animation: clignote 1.4s ease-in-out infinite;
  }

  @keyframes idle-float{
    0%,100%{ transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-3px) rotate(-1.5deg); }
  }
  @keyframes clignote{
    0%,85%,100%{ transform: scaleY(1); }
    90%{ transform: scaleY(0.15); }
  }

  .comptoir{
    position:absolute;
    left:0; right:0; bottom:0;
    width:100%;
    height: 92px;
    z-index: 5;
  }

  .produits{
    position:absolute;
    left:0; bottom: 84px;
    width:100%;
    height: 46px;
    z-index: 4;
    pointer-events:none;
  }

  .plus-btn{
    position:absolute;
    right: 18px;
    top: 18px;
    left: auto;
    bottom: auto;
    width:52px;
    height:52px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    background: radial-gradient(circle at 35% 30%, var(--vert-clair), var(--vert-fonce) 70%);
    box-shadow: 0 8px 18px rgba(27,77,62,.4), inset 0 1px 0 rgba(255,255,255,.18);
    display:flex;
    align-items:center;
    justify-content:center;
    transition: transform .18s ease, box-shadow .18s ease;
    z-index: 6;
  }
  .scene-wrap:hover .plus-btn{
    transform: translateY(-3px) scale(1.08);
    box-shadow: 0 12px 22px rgba(27,77,62,.48), inset 0 1px 0 rgba(255,255,255,.2);
  }
  .plus-btn svg{ width:22px; height:22px; }

  .plus-socle{
    position:absolute;
    right: 10px;
    top: 62px;
    left: auto;
    bottom: auto;
    width: 68px;
    height: 14px;
    background: var(--vert-fonce);
    border-radius: 50%;
    opacity: .18;
    z-index: 5;
    filter: blur(1px);
  }

  .bulle-scene{
    position:absolute;
    left: 8px;
    bottom: 164px;
    min-width: 196px;
    max-width: 220px;
    background: var(--blanc);
    color: var(--encre);
    border: 2.5px solid var(--encre);
    border-radius: 18px 18px 18px 4px;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
    box-shadow: 3px 4px 0 var(--encre);
    opacity: 0;
    transform: scale(.4) translateY(10px);
    transform-origin: bottom left;
    pointer-events:none;
    transition: opacity .15s ease .1s, transform .28s cubic-bezier(.34,1.56,.64,1) .1s;
    z-index: 7;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .bulle-scene .mini-plus{
    flex:0 0 auto;
    width:20px; height:20px;
    border-radius:50%;
    background: var(--vert-fonce);
    display:flex; align-items:center; justify-content:center;
  }
  .bulle-scene .mini-plus svg{ width:11px; height:11px; }

  .bulle-scene::after{
    content:"";
    position:absolute;
    left: 26px;
    bottom: -11px;
    width: 16px;
    height: 16px;
    background: var(--blanc);
    border-left: 2.5px solid var(--encre);
    border-bottom: 2.5px solid var(--encre);
    clip-path: polygon(100% 0, 100% 100%, 0 0);
  }
  .scene-wrap:hover .bulle-scene{
    opacity:1;
    transform: scale(1) translateY(0);
  }

</style>
</head>
<body>

    <svg class="comptoir" viewBox="0 0 360 92" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">

    <div class="plus-socle"></div>

    <div class="bulle-scene">

        <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/></svg>

      Cliquez pour demander des renseignements
    </div>

    <button class="plus-btn" aria-label="Ouvrir le chat" onclick="if (window.mpChatToggle) window.mpChatToggle();">

      </svg>
